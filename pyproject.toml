[project]
name = "nexodocs-ai"
version = "0.1.0"
description = "Agente corporativo de IA com RAG, fontes verificáveis e deploy na Oracle Cloud Infrastructure."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
required-version = "==0.11.32"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
preview = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
exclude = ["src/nexodocs_ai/__init__.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["nexodocs_ai"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=nexodocs_ai",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
